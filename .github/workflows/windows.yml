name: windows-build

# Windows (MSVC) builds for keryx-miner-supr.
#  - windows-amd : keryx-miner-supr.exe + keryxopencl.dll   (AMD/OpenCL + CPU, no CUDA toolchain)
#  - windows-cuda: keryxcuda.dll                            (NVIDIA plugin; drop next to the exe)
# Both are independent jobs: an AMD artifact is produced even if the CUDA job fails.
# Triggers: manual, and on a vX.Y.Z tag (assets are attached to the GitHub release).
#
# NOTE: the legacy ci.yaml / deploy.yaml in this dir are stale upstream (kaspa-*) workflows
# and do not build this fork. This file supersedes them for Windows.

on:
  workflow_dispatch:        # manual run on any branch (use this to iterate the workflow)
  push:
    tags: ['v*']            # release builds — assets attach to the GitHub release
  pull_request:
    paths: ['.github/workflows/windows.yml']   # test the workflow itself on a PR

permissions:
  contents: write          # needed to attach assets to the release on tag builds

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  # ----------------------------------------------------------------------------
  # AMD / OpenCL + CPU — the primary, CUDA-free Windows artifact.
  # ----------------------------------------------------------------------------
  windows-amd:
    name: Windows AMD/OpenCL + CPU (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Keep checked-out line endings as committed (LF) so the .cl / .s / proto
      # files are byte-identical to Linux builds.
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: win-amd

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # OpenCL import library + headers (vendor-neutral Khronos ICD loader).
      # opencl-sys emits `link-lib=OpenCL`; the MSVC linker finds OpenCL.lib via LIB.
      # At runtime the user's AMD driver provides the actual OpenCL.dll.
      - name: Install OpenCL (vcpkg)
        shell: pwsh
        run: |
          vcpkg install opencl:x64-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "LIB=$root\lib;$env:LIB"         | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INCLUDE=$root\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build binary + OpenCL plugin
        shell: pwsh
        # --features pom-opencl is REQUIRED on the binary — without it the whole Proof-of-Model
        # path is #[cfg]'d out of keryx-miner-supr, so the Windows AMD binary can only mine legacy
        # kHeavyHash and submits PROOFLESS shares post-fork ("pom proof required (hardfork
        # active)"). The Linux AMD build (hiveos/build-amd-glibc.sh) passes it; Windows must too.
        # Build the plugin and the binary as SEPARATE commands (mirrors the Linux script): the
        # keryxopencl plugin has no `pom-opencl` feature, so passing it alongside -p keryxopencl
        # would fail ("package does not contain this feature"). pom_opencl.rs is portable and
        # OpenCL.lib is already on LIB via the vcpkg step above.
        run: |
          cargo build --release --target $env:TARGET -p keryxopencl
          cargo build --release --target $env:TARGET --features pom-opencl -p keryx-miner-supr

      - name: Stage artifact
        shell: pwsh
        run: |
          $rel = "target\$env:TARGET\release"
          $out = "dist-win-amd"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$rel\keryx-miner-supr.exe" $out\
          Copy-Item "$rel\keryxopencl.dll"      $out\
          @"
          keryx-miner-supr — Windows (AMD/OpenCL + CPU)

          Files:
            keryx-miner-supr.exe  - the miner
            keryxopencl.dll       - OpenCL worker (auto-loaded; mines on AMD GPUs)

          Keep both files in the same folder. The miner dlopens keryxopencl.dll at
          startup; on a box with an AMD OpenCL platform it self-enables. Requires the
          AMD GPU driver (provides OpenCL.dll) installed on the machine.

          For NVIDIA GPUs, also drop keryxcuda.dll (from the windows-cuda artifact)
          into this folder.

          EASIEST START: open start.bat in Notepad, replace REPLACE_ME with your
          keryx wallet address (and rename rig1 if you like), save, then just
          double-click start.bat. It keeps the window open if the miner exits.

          Example (manual):
            keryx-miner-supr.exe -s stratum+tcp://krx.suprnova.cc:4404 -a <keryx-address>.<worker> --light
          "@ | Out-File -FilePath "$out\README-windows.txt" -Encoding utf8
          @'
          @echo off
          setlocal
          title Keryx Miner

          REM ================================================================
          REM  EDIT THE NEXT LINE: replace REPLACE_ME with YOUR keryx wallet
          REM  address, and change rig1 to any worker name you like.
          REM ================================================================
          set WALLET=keryx:REPLACE_ME.rig1

          set POOL=stratum+tcp://krx.suprnova.cc:4404

          echo Starting keryx-miner-supr as %WALLET%
          echo Pool: %POOL%
          echo.
          keryx-miner-supr.exe -a %WALLET% -s %POOL% --light

          echo.
          echo ================================================================
          echo  The miner STOPPED or CRASHED - read the messages above for the
          echo  reason. This window stays open on purpose. Press any key to close.
          echo ================================================================
          pause
          '@ | Out-File -FilePath "$out\start.bat" -Encoding ascii
          Compress-Archive -Path "$out\*" -DestinationPath "keryx-miner-supr-windows-amd.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: keryx-miner-supr-windows-amd
          path: keryx-miner-supr-windows-amd.zip
          if-no-files-found: error

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: keryx-miner-supr-windows-amd.zip

  # ----------------------------------------------------------------------------
  # NVIDIA / CUDA plugin — heavier (needs the CUDA toolkit). Independent of the
  # AMD job. cust 0.3 is old; if this needs iteration the AMD artifact still ships.
  # ----------------------------------------------------------------------------
  windows-cuda:
    name: Windows NVIDIA/CUDA plugin (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: win-cuda

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The CUDA toolkit provides cudart + nvrtc (for cust) AND OpenCL.lib on Windows.
      # The mining PTX is pre-generated (include_str!) so nvcc isn't strictly needed,
      # but cust_raw links the driver/runtime libs the toolkit installs.
      - name: Install CUDA toolkit
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "nvrtc", "nvrtc_dev"]'

      - name: Build CUDA plugin
        shell: pwsh
        run: cargo build --release --target $env:TARGET -p keryxcuda

      - name: Stage artifact
        shell: pwsh
        run: |
          $rel = "target\$env:TARGET\release"
          $out = "dist-win-cuda"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$rel\keryxcuda.dll" $out\
          @"
          keryx-miner-supr — Windows NVIDIA/CUDA plugin

          keryxcuda.dll - CUDA worker. Drop this into the SAME folder as
          keryx-miner-supr.exe (from the windows-amd artifact). The miner auto-loads
          it and mines on NVIDIA GPUs. Requires an NVIDIA driver.
          "@ | Out-File -FilePath "$out\README-cuda.txt" -Encoding utf8
          Compress-Archive -Path "$out\*" -DestinationPath "keryxcuda-windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: keryxcuda-windows
          path: keryxcuda-windows.zip
          if-no-files-found: error

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: keryxcuda-windows.zip

  # ----------------------------------------------------------------------------
  # NVIDIA Proof-of-Model — self-contained .exe with candle-CUDA (PoM, post-fork)
  # + the static kHeavyHash worker (pre-fork). Bundles the cuBLAS/cuRAND runtime
  # DLLs next to the exe. EXPERIMENTAL: candle-CUDA on Windows/MSVC. Independent
  # job — failure here does NOT block the kHeavyHash artifacts above.
  # ----------------------------------------------------------------------------
  windows-cuda-pom:
    name: Windows NVIDIA PoM (candle-CUDA, MSVC)
    # Pinned to windows-2022 (VS 2022): CUDA 12.5 nvcc only supports VS 2017-2022,
    # and windows-latest now ships a newer VS that nvcc rejects (host_config.h check).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: win-cuda-pom

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Full CUDA toolkit: candle-CUDA needs nvcc + cudart + cuBLAS + cuBLASLt +
      # cuRAND (link import libs + headers). Install everything to be safe.
      - name: Install CUDA toolkit (full)
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.26   # v0.2.26 is the first with CUDA 12.9.1 (v0.2.24 tops out at 12.9.0)
        with:
          cuda: '12.9.1'
          method: 'network'

      # nvcc (candle-kernels) needs the MSVC host compiler cl.exe on PATH.
      - name: Set up MSVC (cl.exe in PATH)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build static-cuda + pom-cuda (self-contained PoM exe)
        shell: pwsh
        env:
          # 70 = lowest arch candle-kernels compiles for; its sm_70 PTX
          # forward-JITs across sm_70→sm_120 (Volta→5090). Was 80 (broke
          # Volta/Turing GPU inference). Pascal sm_61 → --cpu-inference.
          CUDA_COMPUTE_CAP: "70"
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          & "$env:CUDA_PATH\bin\nvcc.exe" --version
          cargo build --release --target $env:TARGET --features static-cuda,pom-cuda -p keryx-miner-supr

      # The in-process llama.cpp engine as keryx-llama.dll. Without it a Windows NVIDIA rig cannot
      # serve the H4/H6 models (they load ONLY via llama.cpp; candle has no loader) and inference
      # falls through to unusable CPU. Built here because CUDA + MSVC are already set up in this job.
      # 120-real = NATIVE Blackwell (5070Ti/5080/5090) SASS — needs CUDA >= 12.8 (why the toolkit is
      # 12.9 above). 90-virtual keeps a compute_90 PTX fallback that forward-JITs to any newer arch.
      # Native sm_120 avoids the load-time JIT and any Blackwell-on-Windows JIT edge case (a community
      # dev found upstream's no-120 llama build crashed 5090s on every inference → strikes; ours is
      # safe because Linux ships native 120 and Windows had 90-virtual, but native 120 hardens both).
      - name: Build keryx-llama.dll (in-process llama.cpp engine)
        shell: pwsh
        run: |
          $tag = "b10015"
          if (-not (Test-Path "llama-src")) {
            git clone --quiet --depth 1 --branch $tag https://github.com/ggml-org/llama.cpp llama-src
          }
          $llamaSrc = (Resolve-Path "llama-src").Path
          cmake -S tools/keryx-llama -B build-llama `
            -G "Visual Studio 17 2022" -A x64 `
            -DLLAMA_SRC="$llamaSrc" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_ARCHITECTURES="75-real;80-real;86-real;89-real;90-real;120-real;90-virtual" `
            -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH\bin\nvcc.exe"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build-llama --config Release --target keryx-llama -j 4
          if ($LASTEXITCODE -ne 0) { throw "keryx-llama.dll build failed" }
          $dll = Get-ChildItem -Path build-llama -Recurse -Filter keryx-llama.dll | Select-Object -First 1
          if (-not $dll) { throw "keryx-llama.dll not produced" }
          Write-Host "built $($dll.FullName) ($([math]::Round($dll.Length/1MB,1)) MB)"
          Copy-Item $dll.FullName "keryx-llama.dll" -Force

      - name: Stage artifact (exe + bundled CUDA runtime DLLs)
        shell: pwsh
        run: |
          $rel = "target\$env:TARGET\release"
          $out = "dist-win-cuda-pom"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$rel\keryx-miner-supr.exe" $out\
          # In-process llama.cpp engine — REQUIRED to serve H4/H6 models on Windows/NVIDIA.
          if (Test-Path "keryx-llama.dll") {
            Copy-Item "keryx-llama.dll" $out\
          } else {
            throw "keryx-llama.dll missing — the NVIDIA PoM package must ship the llama.cpp engine"
          }
          $cudaBin = "$env:CUDA_PATH\bin"
          foreach ($pat in @("cublas64_*.dll","cublasLt64_*.dll","curand64_*.dll","cudart64_*.dll")) {
            Get-ChildItem -Path $cudaBin -Filter $pat -ErrorAction SilentlyContinue | Copy-Item -Destination $out
          }
          @"
          keryx-miner-supr — Windows NVIDIA (Proof-of-Model)

          Self-contained PoM miner. Keep the bundled *.dll next to the .exe.
          Requires an NVIDIA driver (R535+). Mines kHeavyHash pre-fork and
          auto-switches to PoM at the hardfork.

          EASIEST START: open start.bat in Notepad, replace REPLACE_ME with your
          keryx wallet address (and rename rig1 if you like), save, then just
          double-click start.bat. It keeps the window open if the miner exits.

          Example (manual):
            keryx-miner-supr.exe -s stratum+tcp://krx.suprnova.cc:4404 -a <keryx-address>.<worker> --light
          "@ | Out-File -FilePath "$out\README-nvidia-pom.txt" -Encoding utf8
          @'
          @echo off
          setlocal
          title Keryx Miner

          REM ================================================================
          REM  EDIT THE NEXT LINE: replace REPLACE_ME with YOUR keryx wallet
          REM  address, and change rig1 to any worker name you like.
          REM ================================================================
          set WALLET=keryx:REPLACE_ME.rig1

          set POOL=stratum+tcp://krx.suprnova.cc:4404

          echo Starting keryx-miner-supr as %WALLET%
          echo Pool: %POOL%
          echo.
          keryx-miner-supr.exe -a %WALLET% -s %POOL% --light

          echo.
          echo ================================================================
          echo  The miner STOPPED or CRASHED - read the messages above for the
          echo  reason. This window stays open on purpose. Press any key to close.
          echo ================================================================
          pause
          '@ | Out-File -FilePath "$out\start.bat" -Encoding ascii
          Get-ChildItem $out | Format-Table Name,Length
          Compress-Archive -Path "$out\*" -DestinationPath "keryx-miner-supr-windows-nvidia-pom.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: keryx-miner-supr-windows-nvidia-pom
          path: keryx-miner-supr-windows-nvidia-pom.zip
          if-no-files-found: error

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: keryx-miner-supr-windows-nvidia-pom.zip
