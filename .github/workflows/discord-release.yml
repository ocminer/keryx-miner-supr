name: discord-release
# Posts every published (non-prerelease) GitHub release of this repository to Discord.
# Needs the repository secret DISCORD_WEBHOOK (a Discord channel webhook URL); without it the job is skipped.
# Optional repository variable DISCORD_ROLE_ID: a role id that is mentioned in the post.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to post (e.g. v1.2.3)
        required: true
permissions:
  contents: read
concurrency:
  group: discord-release-${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch }}
jobs:
  post:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.run_attempt == 1 && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    steps:
      - name: Post release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch }}
        shell: python
        run: |
          import json, os, re, subprocess, sys, urllib.request
          hook = os.environ.get("WEBHOOK", "").strip()
          if not hook:
              print("DISCORD_WEBHOOK secret not set - skipping"); sys.exit(0)
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          rel = json.loads(subprocess.run(["gh", "api", f"repos/{repo}/releases/tags/{tag}"],
                                          capture_output=True, text=True, check=True).stdout)
          if rel.get("draft") or rel.get("prerelease"):
              print("draft or prerelease - skipping"); sys.exit(0)
          name = repo.split("/")[1]
          body = re.sub(r"<!--.*?-->", "", rel.get("body") or "", flags=re.S).strip()
          body = re.sub(r"^#{1,3} [^\n]*\n+", "", body, count=1)  # title already shown above
          body = re.sub(r"\n{3,}", "\n\n", body)
          rname = (rel.get("name") or "").strip()
          title = rname if name.lower() in rname.lower() else f"{name} {rname or tag}"
          limit = 3500
          if len(body) > limit:
              body = body[:limit].rsplit("\n", 1)[0] + f"\n\n… full release notes: {rel['html_url']}"
          assets = [a for a in rel.get("assets", []) if not a["name"].endswith(".sha256")]
          embed = {
              "title": title[:256],
              "url": rel["html_url"],
              "description": body or "New release.",
              "color": 0x2ECC71,
              "fields": [
                  {"name": "Download", "value": f"[{tag} on GitHub]({rel['html_url']})", "inline": True},
                  {"name": "Files", "value": str(len(assets)), "inline": True},
              ],
              "timestamp": rel.get("published_at"),
          }
          role = os.environ.get("ROLE_ID", "").strip()
          payload = {
              "username": "Suprnova Releases",
              "content": (f"<@&{role}> " if role else "") + f"**{name} {tag}** is out!",
              "embeds": [embed],
              "allowed_mentions": {"parse": [], "roles": [role] if role else []},
          }
          req = urllib.request.Request(hook, data=json.dumps(payload).encode(),
                                       headers={"Content-Type": "application/json", "User-Agent": "suprnova-release-bot"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("Discord status", r.status)
